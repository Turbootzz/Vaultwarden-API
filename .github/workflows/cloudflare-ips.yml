name: Cloudflare IP drift

# The Cloudflare ranges behind TRUSTED_PROXY_PRESET=cloudflare are embedded in
# the binary, so they go stale silently. When they do, requests arriving through
# a newly published edge range resolve to the edge address instead of the
# visitor and the IP whitelist denies them — the failure in #40, reappearing in
# a deployment nobody changed. Catch the drift here rather than in production.

on:
  schedule:
    # Weekly; Cloudflare changes these rarely.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; leaving the token in .git/config would only
          # widen what a later step could reach.
          persist-credentials: false

      - name: Check embedded Cloudflare ranges against the published list
        id: check
        # shell: bash brings -o pipefail; the default bash -e does not, and the
        # tee below would otherwise mask a failing check with tee's exit code.
        shell: bash
        run: ./scripts/update-cloudflare-ips.sh --check 2>&1 | tee drift.log

      # A failed scheduled run only emails the last committer, who is not
      # necessarily whoever operates a deployment. File the drift where it can be
      # picked up, and reuse one issue so a monthly-stale list is not monthly noise.
      - name: Open or update the drift issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Embedded Cloudflare IP ranges are stale"
        run: |
          body=$(printf 'The ranges behind `TRUSTED_PROXY_PRESET=cloudflare` no longer match Cloudflare'"'"'s published list.\n\nRequests arriving through a newly published edge range resolve to the edge address instead of the visitor, and the IP whitelist denies them (#40).\n\nFix: run `make update-cloudflare-ips`, review the diff, and open a PR.\n\n```\n%s\n```\n\n_Run: %s/%s/actions/runs/%s_' \
            "$(cat drift.log)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug
          fi
